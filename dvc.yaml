stages:
  preprocess:
    cmd: python -m purchase_propensity.pipelines.preprocess
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/purchase_propensity/data
      - src/purchase_propensity/pipelines/preprocess.py
    params:
      - seed
      - data
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet

  train:
    cmd: python -m purchase_propensity.pipelines.train
    deps:
      - data/processed/train.parquet
      - src/purchase_propensity/features
      - src/purchase_propensity/models/factory.py
      - src/purchase_propensity/models/trainer.py
      - src/purchase_propensity/io.py
      - src/purchase_propensity/pipelines/train.py
    params:
      - seed
      - train
    outs:
      # IDs das runs no MLflow: pequeno e legível, versionado no Git
      - reports/train_runs.json:
          cache: false

  evaluate:
    cmd: python -m purchase_propensity.pipelines.evaluate
    deps:
      - data/processed/test.parquet
      - reports/train_runs.json
      - src/purchase_propensity/models/evaluator.py
      - src/purchase_propensity/io.py
      - src/purchase_propensity/pipelines/evaluate.py
    params:
      - evaluate
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/plots:
          cache: false

  register:
    cmd: python -m purchase_propensity.pipelines.register
    deps:
      - reports/metrics.json
      - src/purchase_propensity/models/registry.py
      - src/purchase_propensity/io.py
      - src/purchase_propensity/pipelines/register.py
    params:
      - registry
    outs:
      - models/champion
      - reports/champion.json:
          cache: false
