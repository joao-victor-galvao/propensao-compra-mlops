# Fluxo completo:
#   docker compose up -d mlflow          # UI em http://localhost:5000
#   docker compose run --rm pipeline     # dvc repro: preprocess -> train -> evaluate -> register
#     (com MLflow vazio, force: docker compose run --rm pipeline dvc repro -f -s preprocess train evaluate register)
#   docker compose up -d --build api     # API em http://localhost:8000/docs

name: purchase-propensity

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2 # mesma versão do cliente no poetry.lock
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      target: pipeline
    profiles: ["pipeline"]
    env_file:
      - path: .env
        required: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app # o DVC atualiza dvc.lock, reports/ e models/ no próprio repositório
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      MODEL_PATH: models/champion
    ports:
      - "8000:8000"

volumes:
  mlflow-data:
